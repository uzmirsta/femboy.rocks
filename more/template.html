    <meta property="og:type" content="website" />

</head>

<body>
    <!-- particles -->
    <canvas id="particles" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none;"></canvas>

    <!-- mascot -->
    <img src="../assets/images/astolfo.png" alt="Astolfo" class="bg-character-left">

    <!-- title -->
    <div id="center">
        <h1>subpage title</h1>
    </div>

    <!-- nav -->
    <div class="card-buttons">
        <a href="../more/" class="card-btn">← more</a>
        <a href="../" class="card-btn">home</a>
    </div>

    <!-- card -->
    <div class="profile-panel">
        <div class="card">
            <!-- icon -->
            <img src="../assets/images/exuumi.jpg" alt="icon">
            <div class="card-content">
                <h2 class="username">section title</h2>
                <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Quisquam, quod.</p>
            </div>
        </div>
        <div class="card-buttons">
            <a href="#" class="card-btn">action 1</a>
            <a href="#" class="card-btn">action 2</a>
        </div>
    </div>

    <!-- script -->
    <script>
        const canvas = document.getElementById('particles');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let particles = [];
        const numParticles = 80;

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 1;
                this.speedX = Math.random() * 0.5 - 0.15;
                this.speedY = Math.random() * 0.5 - 0.15;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
                if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;
            }
            draw() {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        for (let i = 0; i < numParticles; i++) {
            particles.push(new Particle());
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animate);
        }
        animate();

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            particles.forEach(p => {
                p.x = Math.min(p.x, canvas.width);
                p.y = Math.min(p.y, canvas.height);
            });
        });
    </script>
</body>

</html>
