    <script src="assets/particles.js"></script>
    <script>

        const fadeTargets = [
            [document.querySelector('.bg-character-left'), parseFloat(getComputedStyle(document.querySelector('.bg-character-left')).opacity)],
            [document.getElementById('particles'), 1]
        ].filter(([el]) => Boolean(el));
        if (fadeTargets.length) {
            const updateFade = () => {
                const pageHeight = Math.max(document.documentElement.scrollHeight, document.body.scrollHeight);
                const start = pageHeight * 0.5;
                const end = pageHeight * 0.7;
                const t = Math.min(1, Math.max(0, (window.scrollY - start) / (end - start)));
                fadeTargets.forEach(([el, base]) => { el.style.opacity = String(base * (1 - t)); });
            };
            window.addEventListener('scroll', updateFade);
            window.addEventListener('resize', updateFade);
            updateFade();
        }
    </script>
